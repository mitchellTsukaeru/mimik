name: Submit to Stores

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to submit (e.g., v1.0.0)"
        required: true
        type: string
      dryRun:
        description: Dry run (build + zip but skip submission)
        required: false
        default: false
        type: boolean
      targets:
        description: Which stores to submit to
        required: true
        default: chrome
        type: choice
        options:
          - chrome-firefox
          - chrome
          - firefox

jobs:
  submit:
    name: Submit to Stores
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - name: Lint and test
        run: |
          pnpm lint
          pnpm test

      - name: Build and zip
        run: pnpm zip:all

      - name: Create checksums
        run: shasum -a 256 .output/*.zip > .output/SHA256SUMS.txt

      - name: Preserve release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mimik-${{ inputs.tag }}
          path: |
            .output/*-chrome.zip
            .output/*-firefox.zip
            .output/*-sources.zip
            .output/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create or update GitHub release
        if: ${{ !inputs.dryRun }}
        run: |
          gh release view "${{ inputs.tag }}" >/dev/null 2>&1 || \
            gh release create "${{ inputs.tag }}" --verify-tag --generate-notes --title "Mimik ${{ inputs.tag }}"
          gh release upload "${{ inputs.tag }}" \
            .output/*-chrome.zip \
            .output/*-firefox.zip \
            .output/*-sources.zip \
            .output/SHA256SUMS.txt \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Submit to Chrome Web Store
        if: inputs.targets != 'firefox' && !inputs.dryRun
        run: |
          pnpm wxt submit --chrome-zip .output/*-chrome.zip
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

      - name: Submit to Firefox AMO
        if: inputs.targets != 'chrome' && !inputs.dryRun
        run: |
          pnpm wxt submit \
            --firefox-zip .output/*-firefox.zip \
            --firefox-sources-zip .output/*-sources.zip
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
